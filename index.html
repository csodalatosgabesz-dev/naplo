</style></head><body><main>

function vSum(){
 var a=[],e=[],ti=0,te=0,mx=1;for(var m=0;m<12;m++){var v=mt(sy,m),x=mt(sy,m,'exp');a.push(v);e.push(x);ti+=v;te+=x;if(v>mx)mx=v}
 var cat={},pre=sy+'-';for(var k in D)if(k.indexOf(pre)==0)fx(D[k]).inc.forEach(function(r){var c=r.c||'Egyéb';cat[c]=(cat[c]||0)+(r.a||0)});

function ex(){var s=JSON.stringify(D),e=document.getElementById('bk');e.value=s;e.select();try{navigator.clipboard.writeText(s)}catch(x){}}

function fnd(q){q=q.trim().toLowerCase();var r=[];if(q)Object.keys(D).sort().reverse().forEach(function(k){if(!/^\d{4}-/.test(k))return;var x=fx(D[k]),hit=[];x.t.forEach(function(t){if([t.x,t.ad,t.ph].join(' ').toLowerCase().indexOf(q)>=0)hit.push(t.x)});if((x.n||'').toLowerCase().indexOf(q)>=0)hit.push('Jegyzet: '+x.n.slice(0,60));x.inc.concat(x.exp).forEach(function(e){if(((e.m||'')+' '+(e.c||'')).toLowerCase().indexOf(q)>=0)hit.push((e.m||e.c)+' '+ft(e.a))});if(!hit.length&&k.indexOf(q)>=0)hit.push('Nap megnyitása');if(hit.length)r.push('<div class="card" style="cursor:pointer" onclick="cur=\''+k+'\';view=\'day\';render()"><b>'+k+'</b><div class="mut">'+esc(hit.slice(0,3).join(' • '))+'</div></div>')});if(q)CL().forEach(function(c){if([c.n,c.ph,c.ad].join(' ').toLowerCase().indexOf(q)>=0)r.unshift('<div class="card" style="cursor:pointer" onclick="view=\'cust\';render()"><b>'+esc(c.n)+'</b><div class="mut">Ügyfél '+esc(c.ph||'')+'</div></div>')});document.getElementById('qr').innerHTML=r.slice(0,100).join('')||(q?'<p class="mut">Nincs találat.</p>':'')}
function csv(){var r=['Dátum;Típus;Kategória;Megjegyzés;Összeg'],pre=sy+'-',q=function(s){return '"'+String(s||'').replace(/"/g,'""')+'"'};Object.keys(D).sort().forEach(function(k){if(k.indexOf(pre)!=0)return;var x=fx(D[k]);x.inc.forEach(function(e){r.push([k,'Bevétel',q(e.c),q(e.m),e.a].join(';'))});x.exp.forEach(function(e){r.push([k,'Kiadás',q(e.c),q(e.m),-e.a].join(';'))});x.km.forEach(function(e){r.push([k,'Km','',q(e.m),e.a].join(';'))})});var s=r.join('\n'),t=document.getElementById('bk');t.value=s;t.select();try{navigator.clipboard.writeText(s)}catch(x){}}
