<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#d9531e"><meta name="apple-mobile-web-app-title" content="Napló"><title>Határidőnapló</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1f1d1a;--mut:#8a857d;--ac:#d9531e;--ln:#e6e1d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#222120;--tx:#f1ede6;--mut:#9a958c;--ln:#35332f}}
:root[data-theme="dark"]{--bg:#171614;--card:#222120;--tx:#f1ede6;--mut:#9a958c;--ln:#35332f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 80px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar h2{margin:0;font-size:18px;text-align:center}
.bar button,.sm{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:240px;resize:vertical;line-height:32px;padding:4px 10px;background:repeating-linear-gradient(var(--card),var(--card) 31px,var(--ln) 31px,var(--ln) 32px)}
.t{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.t input{width:22px;height:22px;accent-color:var(--ac)}
.t span{flex:1}.t.d span{text-decoration:line-through;color:var(--mut)}
.t b{color:var(--mut);cursor:pointer;padding:0 6px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.g .h{text-align:center;color:var(--mut);font-size:12px}
.c{min-height:62px;border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:4px;font-size:13px;cursor:pointer;overflow:hidden}
.c.today{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.c i{display:block;font-style:normal;color:var(--ac);font-size:11px}
.c u{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin-left:3px;text-decoration:none}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.row .l{width:34px;color:var(--mut)}.row .b{height:14px;background:var(--ac);border-radius:4px;min-width:2px}.row .v{margin-left:auto;font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
</style></head><body><main>
<nav id="nav"></nav><div id="v"></div>
</main>
<script>
var MN=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
var DN=['Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat','Vasárnap'];
var D={};try{D=JSON.parse(localStorage.getItem('hn')||'{}')}catch(e){}
function save(){try{localStorage.setItem('hn',JSON.stringify(D))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p(n){return(n<10?'0':'')+n}
function ks(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function dt(k){return new Date(k+'T12:00:00')}
function fx(x){if(!x.inc){x.inc=x.i?[{a:x.i,m:x.m||''}]:[];delete x.i;delete x.m}return x}
function g(k){return fx(D[k]||{t:[],n:'',inc:[]})}
function w(k){var x=fx(D[k]||(D[k]={t:[],n:'',inc:[]}));x.u=Date.now();dirty[k]=1;sched();return x}
function ds(x){return x.inc.reduce(function(s,e){return s+(e.a||0)},0)}
function ft(n){return Math.round(n).toLocaleString('hu-HU')+' Ft'}
var today=ks(new Date()),cur=today,view='day',my=new Date().getFullYear(),mm=new Date().getMonth(),sy=my;
function go(v){view=v;render()}
function render(){
 var tabs=[['day','Nap'],['month','Hónap'],['sum','Összesítés']];
 document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button class="'+(view==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 document.getElementById('v').innerHTML=view=='day'?vDay():view=='month'?vMonth():vSum();
}
function vDay(){
 var d=dt(cur),x=g(cur);
 var h='<div class="bar"><button onclick="mv(-1)">‹</button><h2>'+d.getFullYear()+'. '+MN[d.getMonth()].toLowerCase()+' '+d.getDate()+'.<br><span class="mut">'+DN[(d.getDay()+6)%7]+'</span></h2><button onclick="mv(1)">›</button></div>';
 h+='<div style="text-align:center;margin-bottom:10px"><button class="sm" onclick="cur=today;render()">Ma</button></div>';
 h+='<div class="card"><h3>Teendők</h3>'+x.t.map(function(t,i){return '<div class="t'+(t.d?' d':'')+'"><input type="checkbox" '+(t.d?'checked':'')+' onchange="tg('+i+')"><span>'+esc(t.x)+'</span><b onclick="rm('+i+')">✕</b></div>'}).join('')+'<input type="text" id="nt" placeholder="Új teendő…" style="margin-top:8px" onkeydown="if(event.key===\'Enter\')ad()"></div>';
 h+='<div class="card"><h3>Napi bevételek</h3>'+x.inc.map(function(e,i){return '<div class="t"><span>'+esc(e.m||'Bevétel')+'</span><strong>'+ft(e.a)+'</strong><b onclick="ri('+i+')">✕</b></div>'}).join('')+'<div style="display:flex;gap:8px;margin-top:8px"><input type="number" id="ia" inputmode="decimal" placeholder="Összeg (Ft)" style="flex:1"><input type="text" id="im" placeholder="Megjegyzés" style="flex:2" onkeydown="if(event.key===\'Enter\')ai()"><button class="sm" onclick="ai()">+</button></div><div style="margin-top:10px" class="mut">Napi összesen: <b style="color:var(--tx)">'+ft(ds(x))+'</b></div></div>';
 h+='<div class="card"><h3>Jegyzet</h3><textarea oninput="w(cur).n=this.value;save()">'+esc(x.n)+'</textarea></div>';
 return h;
}
function mv(n){var d=dt(cur);d.setDate(d.getDate()+n);cur=ks(d);render()}
function ad(){var e=document.getElementById('nt'),v=e.value.trim();if(!v)return;w(cur).t.push({x:v,d:0});save();render();document.getElementById('nt').focus()}
function tg(i){var t=w(cur).t[i];t.d=t.d?0:1;save();render()}
function rm(i){w(cur).t.splice(i,1);save();render()}
function ai(){var a=parseFloat(document.getElementById('ia').value),m=document.getElementById('im').value.trim();if(!a)return;w(cur).inc.push({a:a,m:m});save();render();document.getElementById('ia').focus()}
function ri(i){w(cur).inc.splice(i,1);save();render()}
function mt(y,m){var s=0,pre=y+'-'+p(m+1)+'-';for(var k in D)if(k.indexOf(pre)==0)s+=ds(fx(D[k]));return s}
function vMonth(){
 var f=new Date(my,mm,1),off=(f.getDay()+6)%7,n=new Date(my,mm+1,0).getDate();
 var h='<div class="bar"><button onclick="mo(-1)">‹</button><h2>'+my+'. '+MN[mm].toLowerCase()+'</h2><button onclick="mo(1)">›</button></div><div class="g">';
 h+=['H','K','Sze','Cs','P','Szo','V'].map(function(s){return '<div class="h">'+s+'</div>'}).join('');
 for(var i=0;i<off;i++)h+='<div></div>';
 for(var d=1;d<=n;d++){var k=my+'-'+p(mm+1)+'-'+p(d),x=g(k),has=x.t.length||x.n;
  h+='<div class="c'+(k==today?' today':'')+'" onclick="cur=\''+k+'\';view=\'day\';render()">'+d+(has?'<u></u>':'')+(ds(x)?'<i>'+Math.round(ds(x)).toLocaleString('hu-HU')+'</i>':'')+'</div>'}
 h+='</div><div class="card" style="margin-top:12px"><h3>Havi bevétel</h3><div class="big">'+ft(mt(my,mm))+'</div></div>';
 return h;
}
function mo(n){mm+=n;if(mm<0){mm=11;my--}if(mm>11){mm=0;my++}render()}
function vSum(){
 var a=[],tot=0,mx=1;for(var m=0;m<12;m++){var v=mt(sy,m);a.push(v);tot+=v;if(v>mx)mx=v}
 var h='<div class="bar"><button onclick="sy--;render()">‹</button><h2>'+sy+'</h2><button onclick="sy++;render()">›</button></div>';
 h+='<div class="card"><h3>Éves bevétel</h3><div class="big">'+ft(tot)+'</div><div class="mut">Havi átlag: '+ft(tot/12)+'</div></div><div class="card"><h3>Havi bontás</h3>';
 h+=a.map(function(v,m){return '<div class="row"><span class="l">'+MN[m].slice(0,3)+'</span><div class="b" style="width:'+Math.round(v/mx*55)+'%"></div><span class="v">'+ft(v)+'</span></div>'}).join('')+'</div>';
 h+=vSync();
 h+='<div class="card"><h3>Mentés / visszaállítás</h3><p class="mut">Az adatok ezen az eszközön tárolódnak. Eszközök között másold át a mentést.</p><button class="sm" onclick="ex()">Mentés másolása</button> <button class="sm" onclick="im()">Betöltés</button><textarea id="bk" style="min-height:90px;line-height:1.3;margin-top:8px;background:var(--bg)" placeholder="Ide illeszd a mentést…"></textarea></div>';
 return h;
}
function ex(){var s=JSON.stringify(D),e=document.getElementById('bk');e.value=s;e.select();try{navigator.clipboard.writeText(s)}catch(x){}}
function im(){try{var o=JSON.parse(document.getElementById('bk').value);if(typeof o=='object'){D=o;var n=Date.now();for(var k in D){D[k].u=n;dirty[k]=1}save();sched();render()}}catch(e){alert('Hibás mentés.')}}
var FB={key:'AIzaSyCvb8aJxGt4dxlIzsBaNA4CdFpZ4yE2Gko',pid:'munkonaplo-b3742'};
var A={};try{A=JSON.parse(localStorage.getItem('hn_a')||'{}')}catch(e){}
var dirty={};try{dirty=JSON.parse(localStorage.getItem('hn_d')||'{}')}catch(e){}
var last=+localStorage.getItem('hn_l')||0,tok='',tokExp=0,tm=null,busy=false,smsg='';
function sd(){try{localStorage.setItem('hn_d',JSON.stringify(dirty))}catch(e){}}
function cfgOk(){return FB.key.indexOf('IDE')!=0}
function sched(){sd();if(!A.rt||!cfgOk())return;clearTimeout(tm);tm=setTimeout(sync,1500)}
async function jf(u,o){var r=await fetch(u,o),j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j}
async function auth(m,email,pw){var j=await jf('https://identitytoolkit.googleapis.com/v1/accounts:'+m+'?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw,returnSecureToken:true})});A={email:email,rt:j.refreshToken,uid:j.localId};tok=j.idToken;tokExp=Date.now()+(+j.expiresIn-60)*1000;localStorage.setItem('hn_a',JSON.stringify(A))}
async function token(){if(tok&&Date.now()<tokExp)return tok;var j=await jf('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(A.rt)});tok=j.id_token;tokExp=Date.now()+(+j.expires_in-60)*1000;A.rt=j.refresh_token;localStorage.setItem('hn_a',JSON.stringify(A));return tok}
async function sync(){
 if(busy||!A.rt||!cfgOk())return;busy=true;
 try{
  var t=await token(),H={Authorization:'Bearer '+t,'Content-Type':'application/json'},base='https://firestore.googleapis.com/v1/projects/'+FB.pid+'/databases/(default)/documents/users/'+A.uid;
  var q={structuredQuery:{from:[{collectionId:'days'}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(Math.max(0,last-300000))}}}}};
  var rows=await jf(base+':runQuery',{method:'POST',headers:H,body:JSON.stringify(q)});
  var ch=false,seen={},mx=last,first=!last;
  rows.forEach(function(x){if(!x.document)return;var f=x.document.fields,k=x.document.name.split('/').pop(),r;try{r=JSON.parse(f.j.stringValue)}catch(e){return}var ru=+f.u.integerValue||0;seen[k]=1;if(ru>mx)mx=ru;var l=D[k];if(!l||ru>(l.u||0)){r.u=ru;D[k]=r;ch=true;delete dirty[k]}else if((l.u||0)>ru)dirty[k]=1});
  if(first)for(var k in D)if(!seen[k]){D[k].u=D[k].u||1;dirty[k]=1}
  for(var k in dirty){if(!D[k]){delete dirty[k];continue}var u0=D[k].u||0,body={fields:{j:{stringValue:JSON.stringify(D[k])},u:{integerValue:String(u0)}}};await jf(base+'/days/'+k,{method:'PATCH',headers:H,body:JSON.stringify(body)});if(D[k]&&(D[k].u||0)===u0)delete dirty[k]}
  last=mx;localStorage.setItem('hn_l',String(last));sd();
  if(ch){save();var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render()}
  smsg='\u2601 Szinkroniz\u00e1lva '+new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
 }catch(e){smsg='Szinkron hiba: '+e.message}
 busy=false;var s=document.getElementById('st');if(s)s.textContent=smsg
}
function vSync(){
 if(!cfgOk())return '<div class="card"><h3>Szinkron</h3><p class="mut">A szinkron m\u00e9g nincs be\u00e1ll\u00edtva (l\u00e1sd README).</p></div>';
 if(A.rt)return '<div class="card"><h3>Szinkron</h3><p>Bejelentkezve: '+esc(A.email)+'</p><div id="st" class="mut" style="margin-bottom:8px">'+esc(smsg)+'</div><button class="sm" onclick="sync()">Szinkron most</button> <button class="sm" onclick="lo()">Kil\u00e9p\u00e9s</button></div>';
 return '<div class="card"><h3>Szinkron</h3><input type="text" id="se" placeholder="E-mail" autocapitalize="off" style="margin-bottom:8px"><input type="password" id="sp" placeholder="Jelsz\u00f3 (min. 6 karakter)" style="width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit"><div style="margin-top:8px"><button class="sm" onclick="li(\'signInWithPassword\')">Bel\u00e9p\u00e9s</button> <button class="sm" onclick="li(\'signUp\')">Regisztr\u00e1ci\u00f3</button></div><div id="st" class="mut" style="margin-top:6px">'+esc(smsg)+'</div></div>'
}
async function li(m){var e=document.getElementById('se').value.trim(),p=document.getElementById('sp').value;try{await auth(m,e,p);last=0;localStorage.setItem('hn_l','0');smsg='Szinkroniz\u00e1l\u00e1s\u2026';render();await sync();render()}catch(x){smsg='Hiba: '+x.message;render()}}
function lo(){A={};tok='';localStorage.removeItem('hn_a');localStorage.setItem('hn_l','0');last=0;smsg='';render()}
setInterval(function(){if(A.rt&&!document.hidden)sync()},30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',function(){sync()});
render();
if(A.rt)sync();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
